<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lật Thẻ Đối Kháng</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mainMenu" class="panel">
        <h1 class="game-title">TRÒ CHƠI LẬT THẺ</h1>
        <button id="btnShowCreate" class="glow-on-hover">Tạo phòng mới (Làm Quản trò)</button>
        <button id="btnShowJoin" class="glow-on-hover">Vào phòng đã có (Người chơi)</button>
    </div>

    <div id="hostPanel" class="panel" style="display: none;">
        <h2>Mã phòng: <span id="hostRoomCode" class="highlight-text">----</span></h2>
        <div id="gmSettings">
            <label>Thời gian tổng (giây): </label>
            <input type="number" id="timeInput" value="60">
        </div>
        <div class="player-list-box">
            <p>Người chơi đã vào: <span id="playerCount">0</span>/2</p>
            <ul id="playerList"></ul>
        </div>
        <button id="btnStartGame" class="glow-on-hover" disabled>BẮT ĐẦU GAME</button>
        <button id="btnBackFromHost" class="btn-secondary">Quay lại</button>
    </div>

    <div id="joinPanel" class="panel" style="display: none;">
        <h2>THAM GIA TRẬN ĐẤU</h2>
        <input type="text" id="joinRoomCode" placeholder="Nhập mã phòng" maxlength="4"><br>
        <input type="text" id="joinPlayerName" placeholder="Tên của bạn" maxlength="15"><br>
        <button id="btnJoinRoom" class="glow-on-hover">Vào Phòng</button>
        <button id="btnBackFromJoin" class="btn-secondary">Quay lại</button>
        <h3 id="waitingMsg" class="pulsing-text" style="display: none;">Đang chờ chủ phòng bắt đầu...</h3>
    </div>

    <div id="gameArea" style="display: none;">
        <div class="top-info">
            <div class="badge">Phòng: <span id="roomDisplay"></span></div>
            <div class="badge" id="timerDisplay">Tổng T.Gian: <span>--</span>s</div>
            <div class="badge">Vai trò: <span id="roleDisplay"></span></div>
        </div>

        <div id="scoreboard">
            <div class="score-box" id="boxP1">
                <div class="player-name" id="nameP1">Player 1</div>
                <div id="scoreP1" class="score-num">0</div>
            </div>
            
            <!-- Khu vực đếm ngược 15s ở giữa -->
            <div class="turn-status">
                <h3 id="turnText">LƯỢT CỦA: <span id="currentTurnName">---</span></h3>
                <div id="turnIndicatorContainer">
                    <div id="turnBar"></div>
                </div>
                <div id="turnTimeText">15s</div>
            </div>

            <div class="score-box" id="boxP2">
                <div class="player-name" id="nameP2">Player 2</div>
                <div id="scoreP2" class="score-num">0</div>
            </div>
        </div>
        
        <div id="cardGrid" class="grid"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
